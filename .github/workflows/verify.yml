name: Verify free edition

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit source boundary
        run: python -B scripts/audit-public-tree.py --git-index
      - name: Unit and isolated backend tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Build free edition from source
        shell: powershell
        run: >-
          .\scripts\build-free.ps1
          -CacheDirectory "$env:RUNNER_TEMP\qizhang-free-cache"
          -OutputDirectory .\artifacts
          -Python python
          -JdkHome "$env:JAVA_HOME"
